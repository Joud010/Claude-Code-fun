<title>Clawds Wiesenausflug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: full-bleed canvas landscape, one small caption card bottom-left, play control bottom-right.
     Single visual world (a sunny-to-starry fantasy meadow), so one palette for every host theme. */
  :root {
    --ink: #2b2340;
    --card: rgba(255, 250, 242, 0.84);
    --clay: #d97757;
    --clay-deep: #b85c3f;
    --sky: #9cc9ec;
    --font-display: "Fredoka", ui-rounded, "Segoe UI Rounded", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--sky); color: var(--ink); overflow: hidden; font-family: var(--font-display); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }
  .card {
    position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: calc(100% - 172px); padding: 10px 14px; border-radius: 14px;
    background: var(--card); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 6px 22px rgba(40, 30, 60, 0.18); pointer-events: none;
  }
  .card h1 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
  .card p { margin: 2px 0 0; font-size: 0.86rem; opacity: 0.82; }
  .controls { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; }
  .controls button {
    position: relative; width: 52px; height: 52px; border: 0; border-radius: 50%;
    background: var(--clay); color: #fff; font: 600 1.1rem var(--font-display); cursor: pointer;
    box-shadow: 0 6px 18px rgba(120, 50, 30, 0.35); transition: transform .15s, background .15s, color .15s;
  }
  .controls button:hover { background: var(--clay-deep); transform: scale(1.06); }
  .controls button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #sound.off { background: var(--card); color: var(--clay-deep); }
  #sound.off::after { content: ""; position: absolute; left: 13px; right: 13px; top: 50%; height: 2.5px; border-radius: 2px; background: currentColor; transform: rotate(-45deg); }
  @media (max-width: 600px) {
    .card { top: calc(12px + env(safe-area-inset-top, 0px)); bottom: auto; left: 16px; max-width: calc(100% - 32px); }
    body .hint { top: calc(86px + env(safe-area-inset-top, 0px)); }
  }
  .hint {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 32px); padding: 7px 14px; border-radius: 999px;
    background: var(--card); font-size: 0.85rem; text-align: center; pointer-events: none;
    box-shadow: 0 4px 14px rgba(40, 30, 60, 0.14); transition: opacity 1.2s;
  }
  .hint.gone { opacity: 0; }
</style>

<canvas id="scene" aria-label="Animation: der kleine Claude-Code-Bot Clawd und sein Kumpel Codex wandern durch eine Fantasy-Landschaft mit Wiesen und Bergen, albern herum und quatschen miteinander"></canvas>
<div class="hint" id="hint">Tippen startet die Musik · tipp auf Clawd oder Codex</div>
<div class="card">
  <h1>Clawds Wiesenausflug</h1>
  <p id="status">Clawd winkt dir zu</p>
</div>
<div class="controls">
  <button id="sound" class="off" type="button" aria-label="Ton an" aria-pressed="false">♪</button>
  <button id="play" type="button" aria-label="Pause">❚❚</button>
</div>

<script>
(() => {
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('play');
  const hint = document.getElementById('hint');
  const FONT = '"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif';

  let W = 0, H = 0;
  function resize() {
    const d = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * d); cv.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- helpers ----------
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const noise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash(i) * (1 - u) + hash(i + 1) * u; };
  const fbm = (x, o = 4) => { let s = 0, a = .5, f = 1, n = 0; for (let k = 0; k < o; k++) { s += a * noise(x * f + k * 31.7); n += a; a *= .5; f *= 2; } return s / n; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  let T = 0, N = 0, dusk = 0, cam = 0;
  let skyTop = [96, 165, 230], skyHor = [255, 228, 196];
  // day colour -> current light (night turns everything blue and dim, dusk warms it)
  const shade = c => {
    let d = mix(c, [c[0] * .2 + 12, c[1] * .26 + 16, c[2] * .42 + 44], N);
    if (dusk > 0) d = mix(d, [d[0] * 1.08 + 18, d[1] * .9, d[2] * .82], dusk * .35);
    return d;
  };
  const haze = (c, a) => mix(shade(c), skyHor, a);

  // ---------- sound: generated music, robot babble, effects ----------
  const soundBtn = document.getElementById('sound');
  const SND = { ac: null, master: null, music: null, sfx: null, noise: null, on: false, muted: false, next: 0, step: 0, timer: null };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function audioInit() {
    if (SND.ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      const ac = SND.ac = new AC();
      SND.master = ac.createGain(); SND.master.gain.value = .85; SND.master.connect(ac.destination);
      SND.music = ac.createGain(); SND.music.gain.value = .3; SND.music.connect(SND.master);
      SND.sfx = ac.createGain(); SND.sfx.gain.value = .6; SND.sfx.connect(SND.master);
      const delay = ac.createDelay(1), fb = ac.createGain(), wet = ac.createGain();
      delay.delayTime.value = .345; fb.gain.value = .28; wet.gain.value = .2;
      SND.music.connect(delay); SND.sfx.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(SND.master);
      const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      SND.noise = buf;
      return true;
    } catch (e) { SND.ac = null; return false; }
  }
  function tone(o) {
    const ac = SND.ac, t = o.t ?? ac.currentTime, dur = o.dur, rel = o.rel ?? .08, atk = o.atk ?? .008;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
    if (o.vib) {
      const l = ac.createOscillator(), lg = ac.createGain();
      l.frequency.value = o.vib; lg.gain.value = o.f * .03; l.connect(lg); lg.connect(osc.frequency);
      l.start(t); l.stop(t + dur + rel + .05);
    }
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(o.v, t + atk);
    if (!o.pluck) g.gain.setValueAtTime(o.v, t + Math.max(atk, dur));
    g.gain.exponentialRampToValueAtTime(.0001, t + dur + rel);
    let node = osc;
    if (o.filt) { const f = ac.createBiquadFilter(); f.type = o.filt[0]; f.frequency.value = o.filt[1]; f.Q.value = o.filt[2] || 1; osc.connect(f); node = f; }
    node.connect(g); g.connect(o.bus || SND.sfx);
    osc.start(t); osc.stop(t + dur + rel + .05);
  }
  function noiseHit(t, dur, v, filt, bus) {
    const ac = SND.ac, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = SND.noise; f.type = filt[0]; f.frequency.value = filt[1]; f.Q.value = filt[2] || 1;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || SND.sfx); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  }

  // a sunny little I–vi–IV–V loop; every second round the melody improvises on the pentatonic scale
  const EIGHTH = 60 / 104 / 2;
  const CHORDS = [[48, [60, 64, 67]], [45, [57, 60, 64]], [41, [53, 57, 60]], [43, [55, 59, 62]]];
  const MELODY = [72, 0, 76, 79, 76, 0, 74, 72, 69, 0, 72, 76, 74, 72, 0, 69, 72, 0, 74, 77, 76, 74, 72, 0, 74, 0, 79, 77, 76, 74, 71, 0];
  const PENTA = [60, 62, 64, 67, 69, 72, 74, 76, 79, 81];
  function scheduleStep(s, t) {
    const bar = Math.floor(s / 8) % 4, beat = s % 8, loop = Math.floor(s / 32);
    const [bass, triad] = CHORDS[bar];
    const night = N > .6;
    if (beat === 0) triad.forEach(m => tone({ f: mtof(m), t, dur: EIGHTH * 7, v: .04, atk: .25, rel: .5, bus: SND.music }));
    if (beat === 0 || beat === 4 || (beat === 6 && !night)) tone({ f: mtof(bass + (beat === 6 ? 7 : 0)), t, dur: EIGHTH * 1.5, v: .2, type: 'triangle', pluck: true, rel: .1, bus: SND.music });
    if (!night && (beat === 0 || beat === 4)) tone({ f: 140, f2: 45, t, dur: .14, v: .3, pluck: true, bus: SND.music });
    if (!night && beat % 2 === 1) noiseHit(t, .05, .045, ['highpass', 7000], SND.music);
    if (B.state === 'nap') return;
    let m = MELODY[s % 32];
    if (loop % 2 === 1) {
      m = hash(s * 3.7 + loop * 11.3) < .55 ? PENTA[Math.floor(hash(s * 1.9 + loop) * PENTA.length)] : 0;
      if (beat === 0) m = triad[0] + 12;
    }
    if (m) {
      tone({ f: mtof(m), t, dur: EIGHTH * .8, v: night ? .035 : .055, type: 'square', pluck: true, rel: .12, filt: ['lowpass', night ? 1100 : 2400], bus: SND.music });
      if (beat === 0) tone({ f: mtof(m + 12), t, dur: .4, v: .04, pluck: true, rel: .3, bus: SND.music });
    }
  }
  function musicTick() {
    if (!SND.on || !playing) return;
    const now = SND.ac.currentTime;
    if (SND.next < now) SND.next = now + .05;
    while (SND.next < now + .2) { scheduleStep(SND.step, SND.next); SND.next += EIGHTH; SND.step++; }
  }

  const SFX = {
    // beep-boop gibberish: one blip per ~3 letters, ending up for ?/! and down otherwise
    voice(text) {
      let t = SND.ac.currentTime + .02;
      const ex = text.includes('!'), q = text.includes('?');
      const n = clamp(Math.round(text.replace(/[^a-zäöüß]/gi, '').length / 3), 2, 9);
      const base = ex ? 720 : 580;
      for (let i = 0; i < n; i++) {
        const d = rand(.055, .11), f = base * Math.pow(2, rand(-3, 8) / 12);
        const f2 = i === n - 1 ? f * (q ? 1.6 : ex ? 1.35 : .75) : f * rand(.85, 1.2);
        tone({ f, f2, t, dur: d, v: .08, type: 'square', rel: .03, filt: ['bandpass', 1500, 1.5] });
        tone({ f, f2, t, dur: d, v: .07, rel: .03 });
        t += d + rand(.02, .06);
      }
    },
    sneeze() {
      const t = SND.ac.currentTime;
      tone({ f: 500, f2: 950, t, dur: .28, v: .07, vib: 18 });
      noiseHit(t + .3, .35, .3, ['bandpass', 2500, .8]);
      tone({ f: 900, f2: 280, t: t + .3, dur: .2, v: .08, type: 'square', filt: ['lowpass', 2000] });
    },
    yawn() { tone({ f: 520, f2: 250, dur: .9, v: .09, type: 'triangle', atk: .15, vib: 5 }); },
    jump() { tone({ f: 260, f2: 660, dur: .14, v: .1, pluck: true }); },
    land() { tone({ f: 160, f2: 60, dur: .1, v: .2, pluck: true }); },
    tadaa() { const t = SND.ac.currentTime; [72, 76, 79, 84].forEach((m, i) => tone({ f: mtof(m), t: t + i * .07, dur: .25, v: .07, type: 'triangle', pluck: true, rel: .3 })); },
    bonk() { const t = SND.ac.currentTime; tone({ f: 420, f2: 140, t, dur: .18, v: .15, type: 'triangle', pluck: true }); tone({ f: 1200, f2: 900, t: t + .05, dur: .5, v: .03, vib: 14 }); },
    pling() { tone({ f: rand(1300, 1900), dur: .08, v: .03, pluck: true, rel: .15 }); },
    snore() { tone({ f: 110, f2: 85, dur: .6, v: .07, type: 'sawtooth', atk: .2, filt: ['lowpass', 380] }); },
    // Codex speaks in quick, musical computer chirps
    cvoice(text) {
      let t = SND.ac.currentTime + .02;
      const ex = text.includes('!'), q = text.includes('?');
      const n = clamp(Math.round(text.replace(/[^a-zäöüß]/gi, '').length / 3), 2, 10);
      const base = ex ? 420 : 350, steps = [0, 3, 5, 7, 10, 12];
      for (let i = 0; i < n; i++) {
        const d = rand(.04, .075), f = base * Math.pow(2, pick(steps) / 12);
        tone({ f, t, dur: d, v: .08, type: 'triangle', rel: .02 });
        tone({ f: f * 2, t, dur: d * .6, v: .025, type: 'square', rel: .02, filt: ['lowpass', 1800] });
        t += d + rand(.015, .04);
      }
      if (q) tone({ f: base * 2, f2: base * 3, t, dur: .1, v: .05, pluck: true });
    },
    clap() { const t = SND.ac.currentTime; noiseHit(t, .09, .5, ['bandpass', 1800, .7]); noiseHit(t + .015, .07, .3, ['bandpass', 1200, .7]); SFX.tadaa(); },
    sparkle() { const t = SND.ac.currentTime; [88, 91, 96].forEach((m, i) => tone({ f: mtof(m), t: t + i * .05, dur: .06, v: .035, pluck: true, rel: .2 })); },
  };
  function sfx(name, arg) {
    if (!SND.on || !playing || !SND.ac) return;
    try { SFX[name](arg); } catch (e) { /* audio is a bonus; never break the animation */ }
  }
  function setSound(on) {
    if (on && !audioInit()) { soundBtn.hidden = true; return; }
    SND.on = on;
    if (on) {
      SND.ac.resume();
      if (!SND.timer) SND.timer = setInterval(musicTick, 50);
    } else if (SND.ac) SND.ac.suspend();
    soundBtn.classList.toggle('off', !on);
    soundBtn.setAttribute('aria-pressed', String(on));
    soundBtn.setAttribute('aria-label', on ? 'Ton aus' : 'Ton an');
  }
  soundBtn.addEventListener('click', () => { SND.muted = SND.on; setSound(!SND.on); });

  // ---------- terrain ----------
  const groundY = wx => H * .8 + Math.sin(wx * .0035) * 10 + Math.sin(wx * .009 + 2) * 5;
  const pathOff = () => Math.min(60, H * .07);
  const pathY = wx => groundY(wx) + pathOff();
  const mtn = (wx, seed, freq) => {
    const r = 1 - Math.abs(noise(wx * freq + seed) * 2 - 1);
    const m = fbm(wx * freq * 1.7 + seed * 3, 4);
    return clamp(r * .65 + m * .55 - .25, 0, 1);
  };
  const farH = wx => .05 + Math.pow(mtn(wx, 3, .0024), 2) * .72;
  const midH = wx => .03 + Math.pow(mtn(wx, 11, .0032), 2) * .46;
  const hillH = wx => .05 + fbm(wx * .003 + 40, 3) * .09;

  // ---------- world state ----------
  const stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random() * .6, r: rand(.5, 1.6), p: rand(0, 6) }));
  const particles = [];
  const butterflies = [];
  const fireflies = [];
  const BF_COLORS = [[255, 160, 60], [120, 180, 255], [240, 110, 200], [255, 225, 90]];
  const FLOWER_COLORS = [[255, 120, 150], [255, 215, 90], [180, 140, 255], [255, 255, 255], [120, 190, 255]];

  function spawnBf(x, y) {
    const b = { x, y, vx: 0, vy: 0, ph: rand(0, 6), s: Math.random(), c: pick(BF_COLORS), chased: false, flee: false };
    butterflies.push(b); return b;
  }
  function puff(type, x, y, o = {}) {
    particles.push(Object.assign({ type, x, y, vx: 0, vy: 0, life: 1, max: 1, s: 1, rot: rand(-.4, .4), c: [255, 255, 255] }, o));
  }
  function dust(x, n = 6) {
    for (let i = 0; i < n; i++) puff('dust', x + rand(-18, 18), pathY(x) - 2, { vx: rand(-50, 50), vy: rand(-40, -8), life: .55, max: .55, s: rand(3, 6), c: [215, 200, 160] });
  }

  // ---------- Clawd ----------
  const B = { x: 0, h: 0, vh: 0, vx: 0, face: 1, state: 'walk', t: 0, dur: 3, anim: 0, rot: 0, sq: 0, wave: 0,
    eyes: 'normal', lookY: 0, moving: false, flags: {}, blinkT: 2, blink: 0, bubble: null, lastTrick: '', target: null, flower: null, napped: false,
    introDone: false, spinning: false, spinAir: 0, dancing: false, dialog: null };

  const LABELS = {
    walk: 'spaziert über die Wiese', hop: 'hüpft herum', spin: 'macht einen Salto', wave: 'winkt dir zu',
    chase: 'jagt einen Schmetterling', trip: 'stolpert über einen Grashalm', dance: 'tanzt', flower: 'schnuppert an einer Blume',
    moonwalk: 'macht den Moonwalk', look: 'bestaunt die Berge', nap: 'macht ein Nickerchen', talk: 'quatscht mit Codex'
  };
  const DUR = { hop: 2.4, spin: 1.9, wave: 2.6, chase: 5.2, trip: 3.4, dance: 3.6, flower: 3.6, moonwalk: 3, look: 3.2, nap: 6.5, talk: 99 };

  function say(text, dur = 2.2) {
    B.bubble = { text, t: 0, dur };
    sfx(text.startsWith('HATSCHI') ? 'sneeze' : text.includes('gähn') ? 'yawn' : 'voice', text);
  }

  function setState(s) {
    if (B.state !== 'walk') B.lastTrick = B.state;
    if (B.target) { B.target.chased = false; B.target = null; }
    B.state = s; B.t = 0; B.flags = {}; B.eyes = 'normal'; B.lookY = 0; B.wave = 0; B.rot = 0;
    B.spinning = false; B.dancing = false;
    B.dur = s === 'walk' ? rand(2.5, 5) : DUR[s];
    statusEl.textContent = s === 'talk' ? 'Clawd und Codex quatschen' : 'Clawd ' + LABELS[s];
    if (REACT[s] && B.introDone && Math.random() < .6) codexSay(pick(REACT[s]), 1.8, rand(1, 1.5));
    switch (s) {
      case 'walk':
        if (Math.random() < .35) say(pick(['La la la ~', 'Was für ein schöner Tag!', 'Frische Bergluft!', 'Hm hm hmm ~', 'Wohin heute?', 'Ich liebe Wiesen.']));
        break;
      case 'hop': say('Hüpf! Hüpf! Hüpf!', 1.8); break;
      case 'spin': say('Pass auf!', 1); break;
      case 'wave': say(pick(['Hallo da draußen!', 'Huhu!', 'Schön, dass du da bist!'])); break;
      case 'chase': {
        say('Ein Schmetterling!!', 1.6);
        let bf = butterflies.filter(b => !b.flee && b.x > B.x - 40 && b.x < B.x + W * .7).sort((a, b) => a.x - b.x)[0];
        if (!bf) bf = spawnBf(B.x + 200, pathY(B.x) - 110);
        bf.chased = true; B.target = bf;
        break;
      }
      case 'dance': say(pick(['Party auf der Wiese!', 'Dance, dance, dance!', 'Mein bester Move!']), 2); break;
      case 'flower': say('Ohh, eine Blume ...', 1.8); B.flower = { x: B.x + 44, c: pick(FLOWER_COLORS) }; break;
      case 'moonwalk': say('Moonwalk-Zeit!', 1.8); break;
      case 'look': say(pick(['Wow, diese Berge ...', 'Ist das ein Schloss da hinten?', 'Da oben schwebt eine Insel!']), 2.8); break;
      case 'nap': say('*gähn* ... gute Nacht', 2); break;
    }
  }

  function nextState() {
    if (B.state !== 'walk') { setState('walk'); return; }
    if (N < .3) B.napped = false;
    if (N > .75 && !B.napped && Math.random() < .55) { B.napped = true; setState('nap'); return; }
    if (!B.introDone || Math.random() < .42) { startDialog(); return; }
    setState(pick(['hop', 'spin', 'wave', 'chase', 'trip', 'dance', 'flower', 'moonwalk', 'look'].filter(s => s !== B.lastTrick)));
  }

  // ---------- Codex, Clawd's hovering buddy ----------
  const C = { x: -2000, h: 0, vh: 0, vx: 0, face: 1, rot: 0, spinT: 0, eyes: 'normal', bubble: null, pending: null, blinkT: 3, blink: 0, dancing: false, ht: 0 };
  const CODEX_FONT = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
  const REACT = {
    spin: ['Wow! 10 von 10!', 'Angeber! Hihi.'], trip: ['Clawd! Alles okay?!'], dance: ['Ich tanz mit!'],
    chase: ['Du schaffst das!', 'Links! Nein, rechts!'], moonwalk: ['Seit wann kannst du DAS?'], look: ['Ich zähle 42 Berge.'],
    hop: ['Warte auf mich!'], flower: ['Riecht sie nach Bugfix?'], nap: ['Psst ... er schläft.'], wave: ['Ich wink auch! Huhu!']
  };
  // [who, text, action]; who is B (Clawd), C (Codex) or both
  const DIALOGS = [

    ctx.beginPath(); ctx.moveTo(-72, 0); ctx.quadraticCurveTo(-42, 45, -10, 92); ctx.lineTo(2, 124); ctx.quadraticCurveTo(22, 60, 72, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = rgb(haze([110, 85, 80], .2));
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.quadraticCurveTo(16, 60, 2, 124); ctx.quadraticCurveTo(22, 60, 72, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = rgb(haze([125, 195, 95], .15));
    ctx.beginPath(); ctx.ellipse(0, 0, 76, 13, 0, 0, 7); ctx.fill();
    tree(-28, -2, 1.1, hash(k * 1.9) < .5 ? 'pine' : 'round', .15);
    tree(18, 1, .8, 'round', .15);
    ctx.restore();
  }

  function tree(x, y, s, type, hz) {

    ctx.fillStyle = trunk; ctx.fillRect(x - 2 * s, y - 12 * s, 4 * s, 12 * s);
    if (type === 'pine') {
      ctx.fillStyle = rgb(leaf);
      for (let i = 0; i < 3; i++) {
        const w = (13 - i * 3) * s, yy = y - (10 + i * 9) * s;
        ctx.beginPath(); ctx.moveTo(x - w, yy); ctx.lineTo(x, yy - 16 * s); ctx.lineTo(x + w, yy); ctx.fill();
      }
    } else {
      ctx.fillStyle = rgb(leaf);
      ctx.beginPath(); ctx.arc(x - 7 * s, y - 16 * s, 8 * s, 0, 7); ctx.arc(x + 7 * s, y - 16 * s, 8 * s, 0, 7); ctx.arc(x, y - 22 * s, 11 * s, 0, 7); ctx.fill();
      ctx.fillStyle = rgb(leaf2);
      ctx.beginPath(); ctx.arc(x - 3 * s, y - 25 * s, 5 * s, 0, 7); ctx.fill();
    }
  }

  function drawHills() {
    const p = .5, off = cam * p, base = H * .78;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 6; x += 6) ctx.lineTo(x, base - hillH(x + off) * H);
    ctx.lineTo(W + 6, H); ctx.closePath();
    ctx.fillStyle = rgb(haze([105, 170, 85], .22)); ctx.fill();
    const sp = 42;
    for (let k = Math.floor((off - 40) / sp); k <= Math.floor((off + W + 40) / sp); k++) {
      if (hash(k * 1.7) > .42) continue;
      const wx = k * sp + hash(k * 3.3) * 20;

    }
  }

  function flower(x, y, s, c) {
    ctx.strokeStyle = rgb(shade([70, 140, 60])); ctx.lineWidth = 1.4 * s;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 2 * s, y - 6 * s, x, y - 12 * s); ctx.stroke();
    ctx.fillStyle = rgb(shade(c));
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 + .3; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 3.2 * s, y - 12 * s + Math.sin(a) * 3.2 * s, 2.6 * s, 0, 7); ctx.fill(); }
    ctx.fillStyle = rgb(shade([255, 205, 70])); ctx.beginPath(); ctx.arc(x, y - 12 * s, 1.8 * s, 0, 7); ctx.fill();
  }

  function mushroom(x, y, s) {
    if (N > .1) {
      const g = ctx.createRadialGradient(x, y - 8 * s, 0, x, y - 8 * s, 26 * s);
      g.addColorStop(0, `rgba(140,255,230,${.45 * N})`); g.addColorStop(1, 'rgba(140,255,230,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 8 * s, 26 * s, 0, 7); ctx.fill();
    }
    ctx.fillStyle = rgb(shade([245, 235, 215])); ctx.fillRect(x - 2 * s, y - 8 * s, 4 * s, 8 * s);
    ctx.fillStyle = rgb(mix(shade([225, 70, 80]), [120, 240, 220], N * .7));
    ctx.beginPath(); ctx.ellipse(x, y - 8 * s, 8 * s, 6 * s, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(x - 3 * s, y - 11 * s, 1.3 * s, 0, 7); ctx.arc(x + 3 * s, y - 10 * s, 1.1 * s, 0, 7); ctx.fill();
  }

  function drawMeadow() {
    const top = (x) => groundY(x + cam);
    const g = ctx.createLinearGradient(0, H * .78, 0, H);
    g.addColorStop(0, rgb(shade([135, 202, 92]))); g.addColorStop(1, rgb(shade([74, 142, 62])));
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 6; x += 6) ctx.lineTo(x, top(x));
    ctx.lineTo(W + 6, H); ctx.closePath(); ctx.fillStyle = g; ctx.fill();

    // winding footpath
    ctx.strokeStyle = rgb(shade([214, 196, 140]), .6); ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 8) { const y = pathY(x + cam) + 4; x === -10 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();

    // grass along the meadow edge
    const wind = T * 2;
    ctx.lineWidth = 1.3;
    for (const [col, ofs] of [[[95, 165, 70], 0], [[120, 195, 85], 3]]) {
      ctx.strokeStyle = rgb(shade(col)); ctx.beginPath();
      for (let wx = Math.floor(cam / 6) * 6 + ofs; wx < cam + W + 6; wx += 6) {
        const x = wx - cam, y = groundY(wx) + 2, h = 6 + hash(wx * .37) * 10, sw = Math.sin(wind + wx * .015) * 3;
        ctx.moveTo(x, y); ctx.quadraticCurveTo(x + sw * .3, y - h * .6, x + sw, y - h);
      }
      ctx.stroke();
    }
    // tufts, flowers and glowing mushrooms scattered over the meadow
    const sp = 29, depth = Math.max(20, H - groundY(cam) - 10);
    ctx.strokeStyle = rgb(shade([88, 158, 66])); ctx.lineWidth = 1.2; ctx.beginPath();
    for (let k = Math.floor(cam / sp) - 1; k <= Math.floor((cam + W) / sp) + 1; k++) {
      const wx = k * sp + hash(k * 1.3) * 20, x = wx - cam, y = groundY(wx) + 8 + hash(k * 8.1) * depth;
      const sw = Math.sin(wind + wx * .02) * 2;
      for (let i = -1; i <= 1; i++) { ctx.moveTo(x + i * 3, y); ctx.lineTo(x + i * 4 + sw, y - 7 - Math.abs(i) * -2); }
    }
    ctx.stroke();
    for (let k = Math.floor(cam / sp) - 1; k <= Math.floor((cam + W) / sp) + 1; k++) {
      const r = hash(k * 3.7);
      const wx = k * sp + hash(k * 6.1) * 22, x = wx - cam, d = hash(k * 2.3), y = groundY(wx) + 6 + d * depth;
      const s = .8 + d * .7;
      if (r < .07) mushroom(x, y, s);
      else if (r < .5) flower(x + Math.sin(wind * .8 + wx) * 1.2, y, s, FLOWER_COLORS[Math.floor(hash(k * 5.9) * FLOWER_COLORS.length)]);
    }
    if (B.flower) {
      const x = B.flower.x - cam, y = pathY(B.flower.x) + 2;
      flower(x + Math.sin(T * 2) * 1.5, y, 2.4, B.flower.c);
    }
  }

  function drawForeground() {
    const p = 1.3, off = cam * p, sp = 9;
    const maxH = Math.max(10, Math.min(70, (H - pathY(cam + W * .4)) * .7));
    ctx.fillStyle = rgb(shade([58, 118, 50]));
    ctx.beginPath();
    for (let k = Math.floor(off / sp) - 1; k <= Math.floor((off + W) / sp) + 1; k++) {
      const x = k * sp - off + hash(k) * 6, h = maxH * (.35 + hash(k * 2.7) * .65), sw = Math.sin(T * 1.8 + k * .35) * 6;
      ctx.moveTo(x - 3, H + 2); ctx.quadraticCurveTo(x + sw * .4, H - h * .6, x + sw, H - h); ctx.quadraticCurveTo(x + 1 + sw * .4, H - h * .5, x + 3, H + 2);
    }
    ctx.fill();
  }

  // ---------- butterflies & fireflies ----------
  function updateCritters(dt) {
    for (const b of butterflies) {
      b.ph += dt * 16;
      if (b.flee) { b.vx = lerp(b.vx, 170, dt * 2); b.vy = lerp(b.vy, -140, dt * 2); }
      else if (b.chased) {
        const tx = B.x + 80 + Math.sin(T * 2.3) * 35, ty = pathY(B.x) - 80 - Math.sin(T * 3.1) * 30;
        b.vx = (tx - b.x) * 2.5; b.vy = (ty - b.y) * 2.5;
      } else {
        b.vx = Math.sin(T * .6 + b.s * 9) * 35 - 6;
        b.vy = Math.cos(T * 1.1 + b.s * 5) * 30 + ((pathY(b.x) - 70 - b.s * 110) - b.y) * .4;
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
    for (let i = butterflies.length - 1; i >= 0; i--) {
      const b = butterflies[i];
      if (b.y < -60 || (!b.chased && b.x < cam - 150)) butterflies.splice(i, 1);
    }
    while (butterflies.length < 3) spawnBf(cam + W + rand(40, 500), pathY(cam + W) - rand(60, 170));

    if (N > .25) {
      while (fireflies.length < 28) fireflies.push({ x: cam + rand(-50, W + 300), y: rand(H * .55, H * .95), p: rand(0, 6) });
    }
    for (let i = fireflies.length - 1; i >= 0; i--) {
      const f = fireflies[i];
      f.x += Math.sin(T * .8 + f.p * 3) * 14 * dt; f.y += Math.cos(T * 1.2 + f.p) * 10 * dt;
      if (f.x < cam - 60 || (N < .2 && Math.random() < dt)) fireflies.splice(i, 1);
    }
  }

  function drawButterfly(b) {
    const x = b.x - cam, y = b.y, w = Math.abs(Math.sin(b.ph));
    ctx.save(); ctx.translate(x, y); ctx.rotate(clamp(b.vx * .003, -.4, .4));
    ctx.fillStyle = rgb(mix(b.c, shade(b.c), .5));
    ctx.beginPath(); ctx.ellipse(-4 * w, -2, 6 * w + .8, 5, -.4, 0, 7); ctx.ellipse(4 * w, -2, 6 * w + .8, 5, .4, 0, 7); ctx.fill();
    ctx.globalAlpha = .8;
    ctx.beginPath(); ctx.ellipse(-3 * w, 4, 4 * w + .6, 3, .4, 0, 7); ctx.ellipse(3 * w, 4, 4 * w + .6, 3, -.4, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#3a2a3a'; ctx.fillRect(-.8, -5, 1.6, 10);
    ctx.restore();
  }

  function drawFireflies() {
    if (N < .2) return;
    for (const f of fireflies) {
      const a = N * (.45 + .55 * Math.sin(T * 3 + f.p * 4)), x = f.x - cam;
      if (a <= 0) continue;
      const g = ctx.createRadialGradient(x, f.y, 0, x, f.y, 10);
      g.addColorStop(0, `rgba(255,250,170,${a})`); g.addColorStop(1, 'rgba(255,250,170,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, f.y, 10, 0, 7); ctx.fill();
    }
  }

  // ---------- particles ----------
  function heartPath(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s * .9);
    ctx.bezierCurveTo(x - s * 1.6, y - s * .2, x - s * .6, y - s * 1.3, x, y - s * .4);
    ctx.bezierCurveTo(x + s * .6, y - s * 1.3, x + s * 1.6, y - s * .2, x, y + s * .9);
  }
  function starPath(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath();
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      if (p.type === 'star' || p.type === 'petal') p.vy += (p.type === 'star' ? 500 : 120) * dt;
      if (p.type === 'petal') { p.vx *= Math.exp(-dt * 1.5); p.vy = Math.min(p.vy, 50); p.rot += dt * 4; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }
  function drawParticles() {
    for (const p of particles) {
      const a = clamp(p.life / p.max * 1.6, 0, 1), x = p.x - cam;
      ctx.globalAlpha = a;
      if (p.type === 'dust') { ctx.fillStyle = rgb(shade(p.c), .7); ctx.beginPath(); ctx.arc(x, p.y, p.s * (1.6 - p.life / p.max), 0, 7); ctx.fill(); }
      else if (p.type === 'heart') { ctx.fillStyle = rgb(p.c); heartPath(x + Math.sin(p.life * 6) * 4, p.y, p.s); ctx.fill(); }
      else if (p.type === 'star') { ctx.fillStyle = rgb(p.c); starPath(x, p.y, p.s); ctx.fill(); }
      else if (p.type === 'petal') { ctx.fillStyle = rgb(shade(p.c)); ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.rot); ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * .55, 0, 0, 7); ctx.fill(); ctx.restore(); }
      else {
        ctx.fillStyle = rgb(p.c); ctx.strokeStyle = 'rgba(60,40,70,.35)'; ctx.lineWidth = 2;
        const size = p.type === 'z' ? p.s * (1.6 - p.life / p.max * .7) : p.s;
        ctx.font = `600 ${size}px ${FONT}`; ctx.textAlign = 'center';
        const tx = x + (p.type === 'note' ? Math.sin(p.life * 5) * 6 : 0), ch = p.type === 'z' ? 'z' : (p.s > 19 ? '♫' : '♪');
        ctx.strokeText(ch, tx, p.y); ctx.fillText(ch, tx, p.y);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Clawd drawing ----------
  function drawBot() {
    const sx = B.x - cam, gy = pathY(B.x), sy = gy - B.h;
    const k = 1 / (1 + B.h / 120);
    ctx.fillStyle = `rgba(30,50,20,${.25 * k})`;
    ctx.beginPath(); ctx.ellipse(sx + (B.state === 'trip' ? B.face * 14 * Math.abs(Math.sin(B.rot)) : 0), gy + 3, 32 * k, 6 * k, 0, 0, 7); ctx.fill();

    ctx.save(); ctx.translate(sx, sy);
    if (B.state === 'trip') { ctx.translate(0, -28 * Math.abs(Math.sin(B.rot))); ctx.rotate(B.rot); }
    else { ctx.translate(0, -30); ctx.rotate(B.rot); ctx.translate(0, 30); }
    ctx.scale(1 + B.sq, 1 - B.sq);
    ctx.scale(B.face, 1);

    const body = rgb(mix([217, 119, 87], [110, 70, 95], N * .45));
    const dark = rgb(mix([178, 88, 60], [80, 50, 70], N * .45));

    [-21, -9, 9, 21].forEach((lx, i) => {
      const ph = B.anim + (i % 2 ? Math.PI : 0);
      const lift = B.moving ? Math.max(0, Math.sin(ph)) * 5 : (B.h > 0 ? 3 : 0);
      const swing = B.moving ? Math.cos(ph) * 2.5 : 0;
      ctx.fillStyle = i === 0 || i === 3 ? dark : body;
      ctx.fillRect(lx - 3 + swing, -16, 6, 16 - lift);
    });

    ctx.fillStyle = body;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-28, -48, 56, 34, 4) : ctx.rect(-28, -48, 56, 34); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(-26, -47, 52, 4);
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(-28, -19, 56, 5);

    ctx.fillStyle = body; ctx.fillRect(-37, -38, 10, 10);
    if (B.wave) {
      ctx.save(); ctx.translate(28, -34); ctx.rotate(-1.3 + Math.sin(T * 14) * .45);
      ctx.fillRect(0, -5, 13, 10); ctx.restore();
    } else ctx.fillRect(27, -38, 10, 10);

    const eyeC = '#1f1a24', ey = -36 + B.lookY;
    ctx.fillStyle = eyeC; ctx.strokeStyle = eyeC; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const ex of [-9, 12]) {
      if (B.eyes === 'happy') { ctx.beginPath(); ctx.moveTo(ex - 4, ey + 2); ctx.lineTo(ex, ey - 3); ctx.lineTo(ex + 4, ey + 2); ctx.stroke(); }
      else if (B.eyes === 'closed') { ctx.beginPath(); ctx.moveTo(ex - 4, ey); ctx.quadraticCurveTo(ex, ey + 3, ex + 4, ey); ctx.stroke(); }
      else if (B.eyes === 'dizzy') { ctx.beginPath(); ctx.moveTo(ex - 3.5, ey - 3.5); ctx.lineTo(ex + 3.5, ey + 3.5); ctx.moveTo(ex + 3.5, ey - 3.5); ctx.lineTo(ex - 3.5, ey + 3.5); ctx.stroke(); }
      else if (B.blink > 0) ctx.fillRect(ex - 3, ey - 1, 6, 2);
      else ctx.fillRect(ex - 3, ey - 5.5, 6, 11);
    }
    if (B.eyes === 'happy' || B.state === 'nap') {
      ctx.fillStyle = 'rgba(255,140,150,.55)';
      ctx.beginPath(); ctx.ellipse(-17, ey + 8, 4, 2.5, 0, 0, 7); ctx.ellipse(20, ey + 8, 4, 2.5, 0, 0, 7); ctx.fill();
    }
    ctx.restore();

    if (B.flags.dizzy) {
      const hx = sx + B.face * 40, hy = gy - 30;
      for (let i = 0; i < 3; i++) {
        const a = T * 6 + i * 2.1;
        ctx.fillStyle = '#ffd95a'; starPath(hx + Math.cos(a) * 18, hy - 14 + Math.sin(a) * 5, 5); ctx.fill();
      }
    }
  }

  function drawBubble(b, ax, ay, codex) {
    if (!b) return;
    const pop = Math.min(1, b.t / .18), s = pop < 1 ? 1 + 2.2 * Math.pow(pop - 1, 3) + 1.2 * Math.pow(pop - 1, 2) : 1;
    const a = Math.min(1, (b.dur - b.t) / .25);
    ctx.font = codex ? `500 14px ${CODEX_FONT}` : `500 16px ${FONT}`;
    const tw = ctx.measureText(b.text).width, w = tw + 24, h = 32;
    const bx = clamp(ax - w / 2, 10, W - w - 10), by = ay - h;
    const tail = clamp(ax, bx + 16, bx + w - 16);
    const fill = codex ? 'rgba(36,38,50,.96)' : 'rgba(255,252,246,.96)';
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
    ctx.translate(ax, ay); ctx.scale(s, s); ctx.translate(-ax, -ay);
    ctx.fillStyle = fill; ctx.strokeStyle = codex ? 'rgba(160,220,255,.35)' : 'rgba(60,40,70,.18)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(bx, by, w, h, codex ? 9 : 14) : ctx.rect(bx, by, w, h);
    ctx.moveTo(tail - 7, by + h - 1); ctx.lineTo(tail, by + h + 9); ctx.lineTo(tail + 7, by + h - 1);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = fill; ctx.fillRect(tail - 6, by + h - 3, 12, 3);
    ctx.fillStyle = codex ? '#e9f4ff' : '#2b2340'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(b.text, bx + 12, by + h / 2 + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  function drawCodex() {
    const sx = C.x - cam, gy = pathY(C.x), hy = codexY();
    if (sx < -90 || sx > W + 90) return;
    const k = 1 / (1 + Math.max(0, gy - hy - 30) / 90);
    ctx.fillStyle = `rgba(30,50,20,${.2 * k})`;
    ctx.beginPath(); ctx.ellipse(sx, gy + 3, 22 * k, 5 * k, 0, 0, 7); ctx.fill();
    const g = ctx.createRadialGradient(sx, hy + 26, 0, sx, hy + 26, 24);
    g.addColorStop(0, `rgba(170,230,255,${.5 + Math.sin(T * 20) * .1})`); g.addColorStop(1, 'rgba(170,230,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(sx, hy + 26, 24, 10, 0, 0, 7); ctx.fill();

    ctx.save(); ctx.translate(sx, hy); ctx.rotate(C.rot); ctx.scale(C.face, 1);
    const body = rgb(mix([54, 56, 72], [44, 44, 70], N * .5)), edge = rgb(mix([96, 100, 122], [70, 72, 104], N * .5));
    ctx.strokeStyle = edge; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(3, -31); ctx.stroke();
    ctx.fillStyle = `rgba(120,235,200,${.55 + .45 * Math.sin(T * 4)})`;
    ctx.beginPath(); ctx.arc(3, -34, 4, 0, 7); ctx.fill();
    const wav = C.eyes === 'happy' ? Math.sin(T * 12) * .5 : Math.sin(T * 2.4) * .12;
    ctx.fillStyle = body;
    for (const sd of [-1, 1]) {
      ctx.save(); ctx.translate(23 * sd, 3); ctx.rotate((.3 - wav) * sd);
      ctx.beginPath(); ctx.ellipse(4 * sd, 0, 7, 4.5, 0, 0, 7); ctx.fill(); ctx.restore();
    }
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-23, -20, 46, 40, 13) : ctx.rect(-23, -20, 46, 40);
    ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#11131a';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-17, -14, 34, 25, 8) : ctx.rect(-17, -14, 34, 25); ctx.fill();

    ctx.strokeStyle = ctx.fillStyle = '#e9f6ff'; ctx.lineWidth = 2.6; ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(150,225,255,.9)'; ctx.shadowBlur = 6;
    ctx.beginPath();
    if (C.eyes === 'happy') { for (const x of [-6, 6]) { ctx.moveTo(x - 4, 0); ctx.lineTo(x, -5); ctx.lineTo(x + 4, 0); } ctx.stroke(); }
    else if (C.eyes === 'sleepy') { for (const x of [-6, 6]) { ctx.moveTo(x - 4, -2); ctx.lineTo(x + 4, -2); } ctx.stroke(); }
    else if (C.eyes === 'surprised') { ctx.arc(-6, -3, 3.3, 0, 7); ctx.moveTo(9.3, -3); ctx.arc(6, -3, 3.3, 0, 7); ctx.stroke(); }
    else {
      // terminal face: a ">" prompt eye and a blinking "_" cursor
      if (C.blink > 0) { ctx.moveTo(-11, -2); ctx.lineTo(-4, -2); } else { ctx.moveTo(-11, -7); ctx.lineTo(-5, -2.5); ctx.lineTo(-11, 2); }
      ctx.stroke();
      if ((T * 1.8) % 1 < .6) ctx.fillRect(1, 0, 10, 3);
    }
    ctx.shadowBlur = 0;
    if (C.eyes === 'happy') {
      ctx.fillStyle = 'rgba(255,140,170,.6)';
      ctx.beginPath(); ctx.ellipse(-13, 15, 3.5, 1.8, 0, 0, 7); ctx.ellipse(13, 15, 3.5, 1.8, 0, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // ---------- frame ----------
  const DAY = 120;
  function frame(dt) {
    T += dt;
    const phase = (.1 + T / DAY) % 1;
    const e = Math.sin(phase * Math.PI * 2) + .22;
    N = 1 - smooth(-.12, .2, e);
    dusk = clamp(1 - Math.abs(e - .02) / .3, 0, 1);
    skyTop = mix(mix([96, 165, 230], [12, 16, 44], N), [120, 110, 190], dusk * .4);
    skyHor = mix(mix([255, 232, 204], [44, 42, 88], N), [255, 150, 110], dusk * .65);

    if (dt > 0) {
      updateBot(dt);
      updateCodex(dt);
      updateCritters(dt);
      updateParticles(dt);
    }
    cam += (B.x - Math.max(W * .38, 175) - cam) * Math.min(1, dt * 2.5);

    drawSky();
    drawSunMoon(phase);
    drawClouds();
    const farBase = H * .66, midBase = H * .72;
    drawRidge(.07, farH, farBase, [150, 158, 210], .35, .26);
    drawCastle(.07, farH, farBase);
    drawIslands();
    drawRidge(.17, midH, midBase, [96, 135, 172], .2, .21);
    drawHills();
    drawMeadow();
    drawFireflies();
    for (const b of butterflies) if (!b.chased) drawButterfly(b);
    drawCodex();
    drawBot();
    for (const b of butterflies) if (b.chased) drawButterfly(b);
    drawParticles();
    drawForeground();
    drawBubble(C.bubble, C.x - cam, codexY() - 56 - (B.bubble ? 44 : 0), true);
    drawBubble(B.bubble, B.x - cam, pathY(B.x) - B.h - 66, false);
  }

  // ---------- input ----------
  let playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setPlaying(v) {
    playing = v;
    btn.textContent = v ? '❚❚' : '▶';
    btn.setAttribute('aria-label', v ? 'Pause' : 'Abspielen');
    if (SND.on && SND.ac) v ? SND.ac.resume() : SND.ac.suspend();
  }
  btn.addEventListener('click', () => { if (!SND.on && !SND.muted) setSound(true); setPlaying(!playing); });
  window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); } });

  cv.addEventListener('pointerdown', e => {
    hint.classList.add('gone');
    if (!SND.on && !SND.muted) setSound(true);
    if (!playing) setPlaying(true);
    const r = cv.getBoundingClientRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;
    // generous hit area around Clawd's body, so a finger on a phone finds him easily
    const bx = B.x - cam + (B.state === 'trip' ? B.face * 24 * Math.abs(Math.sin(B.rot)) : 0);
    const by = pathY(B.x) - B.h - 28;
    const qx = C.x - cam, qy = codexY() - 4;
    if (Math.hypot(cx - qx, cy - qy) < 58 && Math.hypot(cx - qx, cy - qy) < Math.hypot(cx - bx, cy - by)) {
      C.spinT = .8;
      codexSay(pick(['Beep! Kitzeln ist nicht dokumentiert!', 'Hallo! Ich bin Codex.', 'Kompiliere Freude ...', 'Hihi! 200 OK!', 'Ping? Pong!', 'Huiii! Nochmal!']), 1.8);
      return;
    }
    if (Math.abs(cx - bx) < 70 && Math.abs(cy - by) < 72) {
      if (B.h > 1) { say(pick(['Wiiiii!', 'Huiii!']), 1); return; }
      const wasNap = B.state === 'nap';
      setState(pick(['spin', 'hop', 'dance'].filter(s => s !== B.state)));
      say(wasNap ? 'Huch, bin wach!' : pick(['Hihi, das kitzelt!', 'Hey, du!', 'Okay, okay!', 'Juhuu!']), 1.4);
    } else {
      spawnBf(cam + cx, cy);
      sfx('sparkle');
      for (let i = 0; i < 5; i++) puff('star', cam + cx, cy, { vx: rand(-80, 80), vy: rand(-120, -20), life: .6, max: .6, s: rand(2, 4), c: [255, 240, 180] });
      if (B.state === 'walk' && Math.random() < .5) say(pick(['Oh, wie hübsch!', 'Ein neuer Freund!', 'Ooh!']), 1.4);
    }
  });
  setTimeout(() => hint.classList.add('gone'), 9000);

  // ---------- boot ----------
  cam = B.x - Math.max(W * .38, 175);
  C.x = cam - 300;
  for (let i = 0; i < 3; i++) spawnBf(cam + W * (.5 + i * .2), pathY(cam + W * .6) - rand(70, 160));
  setState('wave');
  say('Hallo! Ich bin Clawd.', 2.4);
  setPlaying(playing);

  let last = performance.now();
  frame(0.016);
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    frame(playing ? dt : 0);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
